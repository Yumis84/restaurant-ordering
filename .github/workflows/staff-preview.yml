name: Staff Preview Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/staff-orders-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-staff-static.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bspktoshbiyhfpmulfek.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          KDS_LIVE_ENABLED: 'false'
      - name: Verify safe static preview artifact
        run: |
          test -f out/orders/index.html
          test ! -e out/orders/live
          test ! -e out/staff
          ! grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' out
